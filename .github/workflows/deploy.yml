name: Deploy to EC2

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            image_tag:
                description: "Image tag to deploy (defaults to latest commit SHA)"
                required: false
                default: ""

env:
    ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
    ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Validate required deploy configuration
              env:
                  V_EC2_TARGET_TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
                  V_EC2_TARGET_TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
                  V_AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  V_AWS_REGION: ${{ vars.AWS_REGION }}
                  V_ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
                  V_ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
                  S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
              run: |
                  MISSING=""

                  require_env() {
                    if [ -z "$2" ]; then
                      MISSING="${MISSING} $1"
                    fi
                  }

                  # These are needed for the SSM deploy mechanics itself -- missing any
                  # of them fails the pipeline before we touch AWS, not partway through.
                  require_env EC2_TARGET_TAG_KEY "$V_EC2_TARGET_TAG_KEY"
                  require_env EC2_TARGET_TAG_VALUE "$V_EC2_TARGET_TAG_VALUE"
                  require_env AWS_DEPLOY_ROLE_ARN "$V_AWS_DEPLOY_ROLE_ARN"
                  require_env AWS_REGION "$V_AWS_REGION"
                  require_env ECR_REGISTRY "$V_ECR_REGISTRY"
                  require_env ECR_REPOSITORY "$V_ECR_REPOSITORY"

                  # The app itself needs these to boot at all (Prisma needs a DB to
                  # connect to and to migrate; auth can't sign sessions without a secret).
                  # Google Sign-In, Resend and Firebase push stay optional -- the server
                  # already degrades gracefully when those are blank.
                  require_env DATABASE_URL "$S_DATABASE_URL"
                  require_env JWT_SECRET "$S_JWT_SECRET"

                  if [ -n "$MISSING" ]; then
                    echo "Missing required GitHub variables/secrets:${MISSING}" >&2
                    exit 1
                  fi

            # TEMPORARY -- diagnosing an OIDC "Not authorized to perform
            # sts:AssumeRoleWithWebIdentity" failure. A hash isn't reversible back
            # into the secret, so it's safe to print even though GitHub would mask
            # the raw value. Remove this step once the mismatch is found.
            - name: TEMP debug role arn hash
              env:
                  AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
              run: echo -n "$AWS_DEPLOY_ROLE_ARN" | sha256sum

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push Docker image
              run: |
                  docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                  docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # Env content (and the optional Firebase service account key) is
            # base64-encoded and embedded directly in the SSM command below, rather than
            # staged through S3. Base64 keeps quotes/$/backticks in secret values from
            # being interpreted as shell syntax while the script is assembled and while
            # it runs on the instance.
            #
            # Security note: this means secrets travel through, and are retained in, AWS's
            # SSM command history -- readable by any principal with
            # ssm:GetCommandInvocation/ListCommands on this account. Narrower than shipping
            # them over SSH, but not as tight as a KMS-gated secret store. Content is never
            # printed to GitHub Actions logs.
            - name: Build SSM deploy script
              env:
                  S_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
              run: |
                  mkdir -p /tmp/deploy-env

                  cat > /tmp/deploy-env/.env << 'ENVEOF'
                  PORT=4000
                  NODE_ENV=production
                  DATABASE_URL=${{ secrets.DATABASE_URL }}
                  JWT_SECRET=${{ secrets.JWT_SECRET }}
                  GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
                  RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
                  MAIL_FROM=${{ vars.MAIL_FROM }}
                  FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json
                  ENVEOF

                  ENV_B64=$(base64 -w0 /tmp/deploy-env/.env)

                  # FIREBASE_SERVICE_ACCOUNT_JSON is optional -- push notifications degrade
                  # gracefully without it (see src/utils/push.ts). Write a valid empty JSON
                  # file as a placeholder so the bind-mount below never fails to resolve.
                  if [ -n "$S_FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
                    FIREBASE_JSON_B64=$(printf '%s' "$S_FIREBASE_SERVICE_ACCOUNT_JSON" | base64 -w0)
                  else
                    FIREBASE_JSON_B64=$(printf '{}' | base64 -w0)
                  fi

                  cat > /tmp/deploy.sh << SCRIPT
                  set -e

                  # ── Bootstrap: Docker ─────────────────────────────────────────
                  if ! command -v docker &> /dev/null; then
                    sudo dnf install -y docker
                    sudo systemctl enable --now docker
                    sudo usermod -aG docker ec2-user
                  fi

                  # ── Bootstrap: AWS CLI ────────────────────────────────────────
                  if ! command -v aws &> /dev/null; then
                    curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
                    unzip -q /tmp/awscliv2.zip -d /tmp
                    sudo /tmp/aws/install
                    rm -rf /tmp/awscliv2.zip /tmp/aws
                  fi

                  # ── App directories ──────────────────────────────────────────
                  sudo mkdir -p /opt/zeke-mobile-server
                  sudo chown -R ec2-user:ec2-user /opt/zeke-mobile-server

                  # ── Write env + Firebase service account files ────────────────
                  echo "$ENV_B64" | base64 -d | sudo tee /opt/zeke-mobile-server/.env > /dev/null
                  echo "$FIREBASE_JSON_B64" | base64 -d | sudo tee /opt/zeke-mobile-server/firebase-service-account.json > /dev/null
                  sudo chmod 600 /opt/zeke-mobile-server/.env /opt/zeke-mobile-server/firebase-service-account.json

                  # ── Authenticate EC2 to ECR ───────────────────────────────────
                  aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
                    | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}

                  # ── Pull latest image ─────────────────────────────────────────
                  docker pull ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

                  # ── Run pending Prisma migrations ─────────────────────────────
                  # One-off container, same image, entrypoint overridden -- runs and exits
                  # before the long-lived app container below ever starts.
                  docker run --rm \
                    --env-file /opt/zeke-mobile-server/.env \
                    --entrypoint npx \
                    ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest \
                    prisma migrate deploy

                  # ── Stop and remove old container (ignore error if not running)
                  docker stop zeke-mobile-server || true
                  docker rm   zeke-mobile-server || true

                  # ── Start new container ───────────────────────────────────────
                  docker run -d \
                    --name zeke-mobile-server \
                    --restart unless-stopped \
                    -p 4000:4000 \
                    --env-file /opt/zeke-mobile-server/.env \
                    -v /opt/zeke-mobile-server/firebase-service-account.json:/app/firebase-service-account.json:ro \
                    ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

                  # ── Cleanup ────────────────────────────────────────────────────
                  docker image prune -f
                  SCRIPT

            - name: Send deploy command via SSM
              id: send-command
              env:
                  TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
                  TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
              run: |
                  jq -n --rawfile cmd /tmp/deploy.sh '{commands: ($cmd | rtrimstr("\n") | split("\n"))}' > /tmp/ssm-params.json

                  COMMAND_ID=$(aws ssm send-command \
                    --document-name "AWS-RunShellScript" \
                    --comment "Deploy zeke-mobile-server ($IMAGE_TAG)" \
                    --targets "Key=tag:${TAG_KEY},Values=${TAG_VALUE}" \
                    --parameters file:///tmp/ssm-params.json \
                    --timeout-seconds 300 \
                    --query "Command.CommandId" --output text)

                  echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
                  echo "Sent SSM command $COMMAND_ID targeting tag:${TAG_KEY}=${TAG_VALUE}"

            - name: Wait for deploy to finish
              env:
                  COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
                  TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
                  TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
              run: |
                  set -euo pipefail

                  # Give SSM a moment to fan the command out to matching instances.
                  sleep 8

                  for i in $(seq 1 30); do
                    STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" \
                      --query "Commands[0].Status" --output text 2>/dev/null || echo "Pending")
                    if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
                      break
                    fi
                    echo "Deploy status: $STATUS (attempt $i/30)"
                    sleep 10
                  done

                  echo "Final command status: $STATUS"

                  FAILED=0
                  INSTANCE_IDS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" \
                    --query "CommandInvocations[].InstanceId" --output text)

                  if [ -z "$INSTANCE_IDS" ]; then
                    echo "No instances matched tag:${TAG_KEY}=${TAG_VALUE} for this SSM command."
                    exit 1
                  fi

                  for INSTANCE_ID in $INSTANCE_IDS; do
                    echo "::group::Instance $INSTANCE_ID"
                    aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$INSTANCE_ID" \
                      --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
                      --output json > invocation.json
                    cat invocation.json
                    INV_STATUS=$(jq -r ".Status" invocation.json)
                    if [ "$INV_STATUS" != "Success" ]; then
                      FAILED=1
                    fi
                    echo "::endgroup::"
                  done

                  if [ "$FAILED" -ne 0 ]; then
                    echo "One or more instances failed to deploy."
                    exit 1
                  fi

                  echo "Deploy succeeded on: $INSTANCE_IDS"
